<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>Video Player</title>

<script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>

<style>

html, body{
    margin:0;
    width:100%;
    height:100%;
    background:black;
    overflow:hidden;
}

video{
    width:100%;
    height:100%;
    object-fit:contain;
    background:black;
}

.loader{
    position:absolute;
    top:50%;
    left:50%;
    transform:translate(-50%, -50%);
    color:white;
    font-family:Arial;
}

</style>

</head>
<body>

<div class="loader" id="loader">
Loading video...
</div>

<video
  id="video"
  controls
  autoplay>
</video>

<script>

const params =
  new URLSearchParams(
    window.location.search
  );

const rawUrl =
  params.get("video");

const loader =
  document.getElementById(
    "loader"
  );

const video =
  document.getElementById(
    "video"
  );

if(!rawUrl){

    loader.innerText =
      "No video URL found";

} else {

    const proxyUrl =
      "/proxy?url=" +
      encodeURIComponent(rawUrl);

    if(Hls.isSupported()){

        const hls =
          new Hls();

        hls.loadSource(proxyUrl);

        hls.attachMedia(video);

        hls.on(
          Hls.Events.MANIFEST_PARSED,
          function(){

            loader.style.display =
              "none";

            video.play();
          }
        );

        hls.on(
          Hls.Events.ERROR,
          function(event, data){

            console.error(data);

            loader.innerText =
              "Playback failed";
          }
        );

    } else {

        video.src = proxyUrl;

        loader.style.display =
          "none";
    }
}

</script>

</body>
</html>
