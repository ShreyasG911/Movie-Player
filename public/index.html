<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport"
        content="width=device-width, initial-scale=1.0">

  <title>Universal Protected M3U8 Player</title>

  <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>

  <style>

    body{
      margin:0;
      background:#0d0d0d;
      color:white;
      font-family:Arial;
      padding:20px;
    }

    .container{
      max-width:1100px;
      margin:auto;
    }

    textarea{
      width:100%;
      height:120px;
      padding:15px;
      border:none;
      border-radius:12px;
      background:#1e1e1e;
      color:white;
      font-size:15px;
      resize:none;
    }

    button{
      margin-top:15px;
      padding:12px 20px;
      border:none;
      border-radius:10px;
      background:#2563eb;
      color:white;
      font-size:16px;
      cursor:pointer;
    }

    video{
      width:100%;
      margin-top:25px;
      border-radius:12px;
      background:black;
      max-height:75vh;
    }

    .share{
      margin-top:20px;
    }

    input{
      width:100%;
      padding:12px;
      border:none;
      border-radius:10px;
      background:#1e1e1e;
      color:white;
    }

    .status{
      margin-top:10px;
      color:#bbb;
    }

  </style>
</head>
<body>

<div class="container">

<h1>
Universal Protected M3U8 Player
</h1>

<textarea
  id="url"
  placeholder="Paste protected M3U8 URL here">
</textarea>

<br>

<button onclick="loadVideo()">
Play Video
</button>

<div class="status" id="status"></div>

<video
  id="video"
  controls
  autoplay>
</video>

<div class="share">

<h3>Share Link</h3>

<input
  id="shareLink"
  readonly>

</div>

</div>

<script>

let hls;

function loadVideo(){

    const rawUrl =
      document.getElementById("url")
      .value
      .trim();

    if(!rawUrl){

        alert("Paste URL first");
        return;
    }

    const proxyUrl =
      "/proxy?url=" +
      encodeURIComponent(rawUrl);

    const video =
      document.getElementById("video");

    const status =
      document.getElementById("status");

    if(hls){
        hls.destroy();
    }

    if(Hls.isSupported()){

        hls = new Hls();

        hls.loadSource(proxyUrl);

        hls.attachMedia(video);

        hls.on(
          Hls.Events.MANIFEST_PARSED,
          function(){

            status.innerText =
              "Video loaded";

            video.play();
          }
        );

        hls.on(
          Hls.Events.ERROR,
          function(event, data){

            console.error(data);

            status.innerText =
              "Playback failed";
          }
        );

    } else {

        video.src = proxyUrl;
    }

    const shareUrl =
      window.location.origin +
      "/watch?video=" +
      encodeURIComponent(rawUrl);

    document.getElementById(
      "shareLink"
    ).value = shareUrl;
}

window.onload = function(){

    const params =
      new URLSearchParams(
        window.location.search
      );

    const video =
      params.get("video");

    if(video){

        document.getElementById(
          "url"
        ).value = video;

        loadVideo();
    }
}

</script>

</body>
</html>
